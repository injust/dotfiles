[update]
cooldown_days = 3

[[repos]]
repo = "https://github.com/biomejs/pre-commit"
rev = "v2.6.4"
hooks = [
  { id = "biome-check", fail_fast = true },
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.9.8"
hooks = [
  { id = "tombi-format" },
  { id = "tombi-lint" },
]
